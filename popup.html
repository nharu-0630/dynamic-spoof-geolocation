<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Spoof Geolocation</title>
    <style>
      body {
        width: 320px;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      .section {
        margin-bottom: 16px;
        border-bottom: 1px solid #e0e0e0;
        padding-bottom: 12px;
      }
      .section:last-child {
        border-bottom: none;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        color: #666;
      }
      input[type="number"] {
        width: 100%;
        padding: 6px;
        margin-bottom: 8px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row input {
        flex: 1;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
        cursor: pointer;
        background: #4285f4;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 13px;
      }
      button:hover {
        background: #3367d6;
      }
      button.stop {
        background: #d93025;
      }
      button.stop:hover {
        background: #b92b20;
      }
      select {
        width: 100%;
        padding: 6px;
        margin-bottom: 8px;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .checkbox input {
        width: auto;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="section">
      <label>Latitude</label>
      <input type="number" id="lat" value="35.6895" step="0.0001" />
      <label>Longitude</label>
      <input type="number" id="lng" value="139.6917" step="0.0001" />
    </div>

    <div class="section">
      <label>Mode</label>
      <select id="mode">
        <option value="fixed">Fixed</option>
        <option value="moving">Moving</option>
      </select>

      <div id="movingOptions" style="display: none">
        <label>Bearing (degrees 0-360)</label>
        <input type="number" id="bearing" value="0" min="0" max="360" />

        <label>Speed (km/h)</label>
        <input type="number" id="speed" value="30" min="0" />
      </div>
    </div>

    <div class="section">
      <label>Accuracy (meters)</label>
      <input type="number" id="accuracy" value="10" min="0" />

      <label>Heading (degrees, 0=none)</label>
      <input type="number" id="heading" value="0" min="0" max="360" />

      <label>Speed (m/s, 0=none)</label>
      <input type="number" id="gpsSpeed" value="0" min="0" />
    </div>

    <div class="section">
      <div class="checkbox">
        <input type="checkbox" id="randomize" />
        <label for="randomize" style="margin: 0">Randomize position</label>
      </div>
      <label>Random range (meters)</label>
      <input type="number" id="randomRange" value="5" min="0" />
    </div>

    <button id="apply">Apply</button>
    <button id="stop" class="stop">Stop</button>

    <script src="popup.js"></script>
  </body>
</html>
